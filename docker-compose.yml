version: '3.8'

services:
  # ============================================
  # Doc Viewer API (Backend)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: doc-viewer-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ROOT_DIRS=/documents
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Mount your documents directory
      - ./documents:/documents:ro
      # Persist data (users, collections, etc.)
      - ./data:/app/workspace/backend/data
    networks:
      - doc-viewer-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.openclaw.doc-viewer.component=api"
      - "com.openclaw.doc-viewer.version=1.3.1"

  # ============================================
  # Optional: Redis for caching (Enterprise)
  # ============================================
  # Uncomment for production use
  # redis:
  #   image: redis:7-alpine
  #   container_name: doc-viewer-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - doc-viewer-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================
  # Optional: Nginx Reverse Proxy
  # ============================================
  # Uncomment for production use
  # nginx:
  #   image: nginx:alpine
  #   container_name: doc-viewer-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - doc-viewer-network

  # ============================================
  # Optional: Watchtower for auto-updates
  # ============================================
  # Uncomment for automatic updates
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: doc-viewer-watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 86400 doc-viewer-api
  #   networks:
  #     - doc-viewer-network

networks:
  doc-viewer-network:
    driver: bridge


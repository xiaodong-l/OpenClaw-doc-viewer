# OpenClaw Doc Viewer Nginx 配置 (本地/内网版本)
# 用法：sudo cp nginx-local.conf /etc/nginx/sites-available/doc-viewer
#      sudo ln -sf /etc/nginx/sites-available/doc-viewer /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # 接受所有域名访问

    # =====================
    # 日志配置
    # =====================
    access_log /var/log/nginx/doc-viewer-access.log combined;
    error_log /var/log/nginx/doc-viewer-error.log warn;

    # =====================
    # 前端静态文件
    # =====================
    location / {
        root /path/to/your/home/.openclaw/projects/doc-viewer/workspace/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # =====================
    # 后端 API 代理
    # =====================
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # 头信息
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓存 bypass
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲
        proxy_buffering off;
    }

    # =====================
    # 健康检查
    # =====================
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =====================
    # 限制请求大小
    # =====================
    client_max_body_size 10M;
}

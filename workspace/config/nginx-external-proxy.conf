# 外部 Nginx 代理配置模板
# 将此配置添加到外部 Nginx 服务器 (your-domain.com)
# 位置：/etc/nginx/sites-available/doc-viewer-proxy
# 然后：ln -sf /etc/nginx/sites-available/doc-viewer-proxy /etc/nginx/sites-enabled/

server {
    listen 4430 ssl http2;
    server_name your-domain.com;

    # =====================
    # SSL 证书配置
    # =====================
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # =====================
    # 安全头
    # =====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =====================
    # 日志
    # =====================
    access_log /var/log/nginx/doc-viewer-proxy-access.log combined;
    error_log /var/log/nginx/doc-viewer-proxy-error.log warn;

    # =====================
    # 前端静态文件
    # =====================
    location / {
        # 方式 1: 代理到本机 Nginx (端口 80)
        proxy_pass http://localhost:80;
        
        # 方式 2: 如果直接服务静态文件，取消下面的注释
        # root /path/to/frontend/dist;
        # try_files $uri $uri/ /index.html;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================
    # 后端 API 代理
    # =====================
    location /api/ {
        # 替换为实际的后端服务器地址
        # 如果后端在同一台机器：
        proxy_pass http://localhost:3000;
        
        # 如果后端在另一台机器 (需要开放防火墙):
        # proxy_pass http://后端服务器 IP:3000;
        
        proxy_http_version 1.1;
        
        # 头信息
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲
        proxy_buffering off;
    }

    # =====================
    # 健康检查
    # =====================
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }

    # 请求大小限制
    client_max_body_size 10M;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name:YOUR_PORT$request_uri;
}
